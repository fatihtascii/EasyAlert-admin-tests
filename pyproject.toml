[tool.ruff]
line-length = 150
target-version = "py310"
extend-exclude = [".venv", "reports", "test-results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Türkçe metinlerdeki "belirsiz" unicode karakter uyarıları
    "PT018",                       # tek satırda birleşik assert'ler bilerek kullanılıyor
    "SIM105",                      # try/except/pass bazı yerlerde daha okunaklı
]

[tool.ruff.lint.isort]
known-first-party = ["pages", "utils", "config", "tests"]
