[pytest]
testpaths = tests
addopts = -ra --strict-markers --browser chromium --tracing retain-on-failure --screenshot only-on-failure --output test-results
markers =
    smoke: hızlı temel kontroller
    api: tarayıcısız, doğrudan API testleri (tests/api; otomatik eklenir)
    ui: tarayıcı üzerinden çalışan testler (otomatik eklenir)
    e2e: uçtan uca alarm akışı (webhook -> incident -> bildirim)
    explore: keşif testleri, yalnız EXPLORE=1 ile çalışır
    data_producing: dev ortamında kayıt oluşturan testler (kendi kayıtlarını siler)
